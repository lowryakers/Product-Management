<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/app.css" />
    <title>Offline · ProDough</title>
  </head>
  <body class="bare">
    <main class="main-bare">
      <p class="eyebrow">No signal</p>
      <h1>You are offline</h1>
      <p class="lede">
        Anything you captured while offline is saved on this phone and syncs the moment
        you are back on a network. Nothing is lost.
      </p>
      <a class="btn btn-block" href="/capture">Capture something anyway</a>
      <p style="margin-top: 1.1rem">
        <button class="btn btn-ghost btn-block" onclick="location.reload()">Try again</button>
      </p>
    </main>
  </body>
</html>
